<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Yeh line phone me sahi scaling ke liye sabse zaroori hai -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Mohammad Atif | Portfolio & Tech</title>
  
  <style>
    /* CSS: Sabhi screen sizes par design handle karne ke liye */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px; /* Phone aur desktop dono par compact aur clean dikhega */
      padding: 20px 0;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #238636, #2ea043);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      color: white;
      margin: 0 auto 15px;
    }

    h1 {
      font-size: 24px;
      color: #f0f6fc;
      margin-bottom: 5px;
    }

    p.subtitle {
      color: #8b949e;
      font-size: 14px;
    }

    .section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 18px;
      color: #58a6ff;
      margin-bottom: 12px;
      border-bottom: 1px solid #21262d;
      padding-bottom: 8px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: #21262d;
      border: 1px solid #30363d;
      color: #7ee787;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #238636;
      color: white;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Section -->
    <header>
      <div class="avatar">A</div>
      <h1>Mohammad Atif</h1>
      <p class="subtitle">Tech Enthusiast • BCA Student • Content Creator</p>
    </header>

    <!-- About Section -->
    <div class="section">
      <h2>About Me</h2>
      <p>Building creative tech projects, exploring programming, and sharing modern digital workflows.</p>
    </div>

    <!-- Skills / Projects Section -->
    <div class="section">
      <h2>Skills & Focus</h2>
      <div class="tags">
        <span class="tag">Python</span>
        <span class="tag">C Programming</span>
        <span class="tag">Web Design</span>
        <span class="tag">Digital Content</span>
      </div>
    </div>

    <!-- Links / Action Section -->
    <div class="section">
      <h2>Connect</h2>
      <a href="https://instagram.com" target="_blank" class="btn">Instagram / Socials</a>
      <a href="mailto:contact@example.com" class="btn" style="background-color: #21262d; border: 1px solid #30363d; margin-top: 10px;">Send an Email</a>
    </div>
  </div>

</body>
</html>
